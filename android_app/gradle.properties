
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Djdk.lang.Process.launchMechanism=fork
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Gradle's JDK is selected from the environment: scripts/build_all.sh picks a
# JDK 17-21 (Kotlin 1.9.24 cannot parse newer Java versions), and Android Studio
# needs "Gradle JDK" pointed at 17-21 as well. Do not pin a machine-specific
# path here.
android.suppressUnsupportedCompileSdk=35
org.gradle.caching=true
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
